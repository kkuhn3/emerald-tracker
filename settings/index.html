<!DOCTYPE html>
<html>
<head>
	<title>Emerald Tracker Settings</title>
	<script src="index.js"></script>
	<link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
	<div class="header">
		Archipelago Configs
	</div>

	<div>
		<label>Hostname</label>
		<input type="text" id="AHOST" value="archipelago.gg" />
	</div>
	<div>
		<label>Port</label>
		<input type="text" id="APORT" />
	</div>
	<div>
		<label>Name</label>
		<input type="text" id="ANAME" />
	</div>
	<div>
		<label>Password</label>
		<input type="text" id="APASS" />
	</div>

	<div class="header">
		Randomizer Settings
	</div>
	<div>
		<label>Goal</label>
		<select id="goal">
			<option value="" selected>Champion</option>
			<option value="1">Steven</option>
			<option value="2">Norman</option>
			<!-- <option value="3">Legendary Hunt</option> -->
		</select>
	</div>
	<div>
		<label>Badges</label>
		<select id="badges">
			<option value="0">Vanilla</option>
			<option value="1">Shuffled</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>HMs</label>
		<select id="hms">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Key Items</label>
		<select id="key_items">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Bikes</label>
		<select id="bikes">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Event Tickets</label>
		<select id="event_tickets">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Rods</label>
		<select id="rods">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Overworld Items</label>
		<select id="overworld_items">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Hidden Items</label>
		<select id="hidden_items">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>NPC Gifts</label>
		<select id="npc_gifts">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<div>
		<label>Berry Trees</label>
		<select id="berry_trees">
			<option value="0">Vanilla</option>
			<option value="" selected>Randomized</option>
		</select>
	</div>
	<!-- dexsanity -->
	<!-- trainersanity -->
	<!-- item_pool_type -->
	<div>
		<label>Require Itemfinder</label>
		<select id="require_itemfinder">
			<option value="0">False</option>
			<option value="" selected>True</option>
		</select>
	</div>
	<div>
		<label>Require Flash</label>
		<select id="require_flash">
			<option value="0">Neither</option>
			<option value="1">Only Granite Cave</option>
			<option value="2">Only Victory Road</option>
			<option value="" selected>Both</option>
		</select>
	</div>
	<div>
		<label>Elite Four Requirement</label>
		<select id="elite_four_requirement">
			<option value="0">Badges</option>
			<option value="" selected>Gyms</option>
		</select>
	</div>
	<div>
		<label>Elite Four Count</label>
		<select id="elite_four_count">
			<option value="0">0</option>
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
			<option value="5">5</option>
			<option value="6">6</option>
			<option value="7">7</option>
			<option value="" selected>8</option>
		</select>
	</div>
	<div>
		<label>Norman Requirement</label>
		<select id="norman_requirement">
			<option value="0">Badges</option>
			<option value="" selected>Gyms</option>
		</select>
	</div>
	<div>
		<label>Norman Count</label>
		<select id="norman_count">
			<option value="0">0</option>
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
			<option value="5">5</option>
			<option value="6">6</option>
			<option value="7">7</option>
			<option value="" selected>8</option>
		</select>
	</div>

		</select>
	</div>
	<div>
		<label>Extra Bumpy Slope</label>
		<select id="extra_bumpy_slope">
			<option value="" selected>False</option>

		</select>
	</div>
	<div>
